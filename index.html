<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flashcards de Estudo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Flashcards de Estudo</h1>

    <section class="grid-flashcards">
      
      <!-- Flashcard 1 -->
      <article class="cartao">
        <div class="cartao__conteudo">
          <div class="cartao__face cartao__face--frente">
            <span class="categoria">Programação</span>
            <h3>O que é HTML?</h3>
          </div>
          <div class="cartao__face cartao__face--verso">
            <span class="categoria">Resposta</span>
            <p>HTML (HyperText Markup Language) é a linguagem de marcação usada para estruturar conteúdos na web.</p>
          </div>
        </div>
      </article>

      <!-- Flashcard 2 -->
      <article class="cartao">
        <div class="cartao__conteudo">
          <div class="cartao__face cartao__face--frente">
            <span class="categoria">CSS</span>
            <h3>O que é o Flexbox?</h3>
          </div>
          <div class="cartao__face cartao__face--verso">
            <span class="categoria">Resposta</span>
            <p>É um modelo de layout 1D no CSS projetado para alinhar e distribuir espaço entre itens em um contêiner.</p>
          </div>
        </div>
      </article>

    </section>
  </main>
</body>
</html>
